version: 2

sources:
  - name: paysdelaloire
    description: >
      Pays de la Loire tourism open data (data.paysdelaloire.fr), loaded as-is
      into the raw schema by the Python ingestion. Business columns mirror the
      source file and are documented on the dataset page and in the staging
      model. Only the technical columns added at ingestion are documented here.
    database: "{{ target.dbname }}"
    schema: raw
    tables:
      - name: activities
        identifier: raw_activities
        description: >
          Raw "Activités touristiques" offers
          (234400034_070-011_offre-touristique-activites-rpdl).
        meta:
          dagster:
            # Must match the asset key of the Python raw load asset.
            asset_key: ["degustations_raw_table"]
        columns:
          - name: id
            description: Row identifier in the raw table
            data_tests:
              - not_null
          - name: ingestion_id
            description: Identifier of the ingestion run
            data_tests:
              - not_null
          - name: ingested_at
            description: Timestamp of ingestion
            data_tests:
              - not_null
          - name: source_system
            description: Source system
            data_tests:
              - not_null
          - name: source_file_name
            description: Name of the source file
            data_tests:
              - not_null
          - name: source_row_number
            description: Row number in the source file
            data_tests:
              - not_null
          - name: source_hash
            description: Hash of the source row
            data_tests:
              - not_null
