version: 2

models:
  - name: stg_paysdelaloire__activities
    description: >
      Tourist activities from the Pays de la Loire open data, with columns
      renamed to English snake_case. Only activities with at least one contact
      detail are kept. One row per source row (all ingestions); see
      int_activities__current for one row per activity.
    # TODO(ADR-001): align the columns below with the activities schema.
    columns:
      - name: offer_name
        description: Name of the tourist offer
        data_tests:
          - not_null

      - name: offer_type
        description: Type of offer

      - name: address_line1
        description: Address line 1

      - name: address_line2
        description: Address line 2 (continuation of line 1)

      - name: address_line3
        description: Address line 3

      - name: address_line4
        description: Address line 4

      - name: postal_code
        description: Postal code, as text

      - name: postal_office
        description: Postal distribution office

      - name: city_name
        description: Commune where the activity takes place

      - name: cedex
        description: Cedex

      - name: city_code
        description: INSEE code of the commune

      - name: latitude
        description: Latitude (decimal degrees)
        data_tests:
          - not_null

      - name: longitude
        description: Longitude (decimal degrees)
        data_tests:
          - not_null

      - name: transport_tips
        description: Directions and location details of the offer

      - name: mobile_phone_number
        description: Mobile phone number

      - name: landline_number
        description: Landline number

      - name: fax
        description: Fax number

      - name: email
        description: Email address

      - name: website
        description: Website URL

      - name: video_url
        description: URL to access the video

      - name: code_integration_video
        description: Embed code to integrate a video

      - name: plateforme_type
        description: Video platform or URL type

      - name: tripadvisor_widget
        description: Tripadvisor widget

      - name: activity_sector
        description: Activity sector

      - name: quality_label
        description: Quality labels associated with the offer

      - name: accessibility_label
        description: Accessibility label for disabled tourists ("Tourisme & Handicap")

      - name: animal_acceptance
        description: Whether animals are accepted
        data_tests:
          - accepted_values:
              arguments:
                values: ['oui', 'non']

      - name: animal_acceptance_info
        description: Additional information on animal acceptance

      - name: group_acceptance
        description: Whether groups are accepted
        data_tests:
          - accepted_values:
              arguments:
                values: ['oui', 'non']

      - name: maximum_group_size
        description: Maximum number of people in a group

      - name: minimum_group_size
        description: Minimum number of people in a group

      - name: languages
        description: Languages spoken at the reception

      - name: wine_appellation
        description: Wine appellation (e.g. AOC, IGP). Degustation-only, to review.

      - name: free_tastings
        description: Whether tastings are free of charge. Degustation-only, to review.
        data_tests:
          - accepted_values:
              arguments:
                values: ['oui', 'non']

      - name: tasting_room
        description: Whether an equipped tasting room is available. Degustation-only, to review.
        data_tests:
          - accepted_values:
              arguments:
                values: ['oui', 'non']

      - name: on_site_sales
        description: Whether on-site sales are available. Degustation-only, to review.
        data_tests:
          - accepted_values:
              arguments:
                values: ['oui', 'non']

      - name: duration_individual_visit
        description: Duration of the visit for individual visitors

      - name: duration_group_visit
        description: Duration of the visit for groups

      - name: regular_guided_group_visits
        description: Guided group visits offered on a regular basis
        data_tests:
          - accepted_values:
              arguments:
                values: ['oui', 'non']

      - name: guided_group_visit_on_request
        description: Guided group visits available on request
        data_tests:
          - accepted_values:
              arguments:
                values: ['oui', 'non']

      - name: regular_self_guided_group_visits
        description: Self-guided group visits offered on a regular basis
        data_tests:
          - accepted_values:
              arguments:
                values: ['oui', 'non']

      - name: regular_educational_group_visits
        description: Educational group visits offered on a regular basis
        data_tests:
          - accepted_values:
              arguments:
                values: ['oui', 'non']

      - name: regular_guided_individual_visits
        description: Guided visits for individuals offered on a regular basis
        data_tests:
          - accepted_values:
              arguments:
                values: ['oui', 'non']

      - name: guided_individual_visit_on_request
        description: Guided visits for individuals available on request
        data_tests:
          - accepted_values:
              arguments:
                values: ['oui', 'non']

      - name: languages_of_guided_visits
        description: Languages spoken during guided visits

      - name: regular_self_guided_individual_visits
        description: Self-guided visits for individuals offered on a regular basis
        data_tests:
          - accepted_values:
              arguments:
                values: ['oui', 'non']

      - name: activity_type
        description: Types of offers proposed

      - name: is_address_given
        description: True when at least one of the four address lines is filled
        data_tests:
          - not_null

      - name: activity_key
        description: >
          Best-effort business key: hash of the normalised (lower-cased,
          trimmed) offer name, address lines, postal code and city.
          Not unique here, since each ingestion adds a row.
        data_tests:
          - not_null

      - name: source_row_number
        description: Row number in the source file
        data_tests:
          - not_null

      - name: ingestion_id
        description: Identifier of the ingestion run
        data_tests:
          - not_null

      - name: ingested_at
        description: Timestamp of ingestion
        data_tests:
          - not_null

      - name: source_file_name
        description: Name of the source file
        data_tests:
          - not_null

      - name: source_system
        description: Source system
        data_tests:
          - not_null

      - name: source_hash
        description: Hash of the source row
        data_tests:
          - not_null
          